logger:
  file:
    path: /var/log/open5gs/nssf.log

global:
  max:
    ue: 1024

nssf:
  sbi:
    server:
      - address: nssf.open5gs.org
        port: 7777
    client:
      scp:
        - uri: http://scp.open5gs.org:7777
      nsi:
        - uri: http://nrf.open5gs.org:7777
          s_nssai:
            sst: 1
