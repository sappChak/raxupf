logger:
  file:
    path: /var/log/open5gs/amf.log

global:
  max:
    ue: 1024

amf:
  sbi:
    server:
      - address: amf.open5gs.org
        port: 7777
    client:
      scp:
        - uri: http://scp.open5gs.org:7777
  ngap:
    server:
      - address: amf.open5gs.org
  guami:
    - plmn_id:
        mcc: 999
        mnc: 70
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 999
        mnc: 70
      s_nssai:
        - sst: 1
  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA0, NEA2, NEA1]
  network_name:
    full: raxupf testbed
    short: raxupf
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
